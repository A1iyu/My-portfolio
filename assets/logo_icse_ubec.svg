<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 85" width="280" height="85">
  <rect width="280" height="85" fill="#0d172e" rx="6"/>
  <!-- UBEC DRC Emblem / Graduation Tech Seal -->
  <g transform="translate(18, 12)">
    <!-- Outer Glow Ring -->
    <circle cx="30" cy="30" r="28" fill="#064e3b" stroke="#10b981" stroke-width="2" opacity="0.8"/>
    <!-- Gear / Sun rays -->
    <circle cx="30" cy="30" r="23" fill="#022c22" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Digital Book & Flame / Torch -->
    <path d="M19 36 C24 33, 27 34, 30 36 C33 34, 36 33, 41 36 L41 24 C36 21, 33 22, 30 24 C27 22, 24 21, 19 24 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <path d="M30 24 L30 36" stroke="#10b981" stroke-width="1.2"/>
    <!-- Smart Tech Node on top -->
    <circle cx="30" cy="18" r="3.5" fill="#38bdf8"/>
    <circle cx="23" cy="15" r="2" fill="#34d399"/>
    <circle cx="37" cy="15" r="2" fill="#34d399"/>
    <line x1="23" y1="15" x2="30" y2="18" stroke="#38bdf8" stroke-width="1"/>
    <line x1="37" y1="15" x2="30" y2="18" stroke="#38bdf8" stroke-width="1"/>
    <line x1="30" y1="18" x2="30" y2="24" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- Text: ICSE 2025 & UBEC DRC -->
  <g transform="translate(86, 26)">
    <text x="0" y="0" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.04em">ICSE 2025</text>
    <text x="110" y="-3" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38bdf8" letter-spacing="0.08em">GLOBAL</text>
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#34d399" letter-spacing="0.02em">Smart Education &amp; Digital Literacy</text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#94a3b8" letter-spacing="0.04em">UBEC Digital Resource Center (DRC)</text>
  </g>
</svg>
