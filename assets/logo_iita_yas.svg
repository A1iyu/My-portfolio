      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- 100% transparent, NO glow, NO background box -->

  <!-- Left: YAS (Youth in Agribusiness) -->
