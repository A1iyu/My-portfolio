    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#fdba74" letter-spacing="0.04em">youth in agribusiness</text>
  </g>

  <!-- Center: IITA -->
  <g transform="translate(108, 12)">
    <text x="0" y="34" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#f97316" letter-spacing="0.04em">IITA</text>
    <text x="2" y="47" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#fed7aa" font-style="italic">Transforming African Agriculture</text>
  </g>

